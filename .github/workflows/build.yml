name: Build AirTouch EXE

on:
push:
branches:
- main

jobs:
build:
runs-on: windows-latest

`
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pyinstaller

  - name: Build EXE
    run: |
      pyinstaller --onefile --windowed main.py --name AirTouch

  - name: Upload EXE
    uses: actions/upload-artifact@v4
    with:
      name: AirTouch-EXE
      path: dist/AirTouch.exe
`

